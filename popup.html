<!DOCTYPE html>
<html>
<head>
  <title>Advanced Google Patent Highlighter</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 10px;
      width: 500px;
    }

    .rule-box {
      position: relative;
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
    }

    textarea {
      width: 100%;
      height: 60px;
      font-size: 14px;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .remove-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      z-index: 1;
    }

    .color-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .color-picker {
      width: 40px;
      height: 30px;
      border: none;
      cursor: pointer;
    }

    #addBox, #highlightBtn {
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #addBox {
      background-color: #1976d2;
      color: white;
    }

    #highlightBtn {
      background-color: #43a047;
      color: white;
    }

    #autoHighlightToggle {
      margin-right: 10px;
    }

    label.toggle-label {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 14px;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1><strong>Advanced Google Patent Highlighter</strong></h1>

  <div id="rulesContainer"></div>

  <button id="addBox">+ Add Rule</button>
  <button id="highlightBtn">Highlight</button>

  <label class="toggle-label">
    <input type="checkbox" id="autoHighlightToggle">
    Enable Auto-Highlight on Page Reload
  </label>

  <script src="popup.js"></script>
</body>
</html>
