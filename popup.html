<!DOCTYPE html>
<html>
  <head>
    <title>Multi-Rule Highlighter</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 10px;
        width: 450px;
      }

      .rule-box {
        position: relative;
        padding-bottom: 10px;
      }

      textarea {
        width: 100%;
        height: 50px;
        font-size: 14px;
        padding: 5px;
        box-sizing: border-box;
        border-radius: 4px;
        border: 1px solid #ccc;
        margin-bottom: 5px;
      }

      .remove-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background: red;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 2px 6px;
        cursor: pointer;
        font-size: 12px;
      }

      .color-picker {
        margin-top: 5px;
      }

      #addBox, #highlightBtn {
        margin-top: 10px;
        margin-right: 10px;
        padding: 8px 12px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      #addBox {
        background-color: #1976d2;
        color: white;
      }

      #highlightBtn {
        background-color: #43a047;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="rulesContainer"></div>
    <button id="addBox">+ Add Rule</button>
    <button id="highlightBtn">Highlight</button>
    <script src="popup.js"></script>
  </body>
</html>
